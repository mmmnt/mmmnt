packages:
  - 'packages/*'
  - 'site'

onlyBuiltDependencies:
  - esbuild

overrides:
  'hono': '>=4.12.12 <5'
  '@hono/node-server': '>=2.1.3 <3'
  'picomatch': '>=4.0.2 <5'
  # astro2tsx <0.1.4 leaves @emnapi/runtime to a peer that resolves to rolldown's 2.0 beta,
  # which @emnapi/core 1.x cannot drive, so `astro check` crashed on startup
  '@astrojs/astro2tsx': '>=0.1.4 <0.2'
