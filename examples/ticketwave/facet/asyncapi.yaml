asyncapi: '3.0.0'
info:
  title: 'ticketwave'
  version: '1.0.0'
  description: ''

channels:
  event-published:
    address: 'event-published'
    messages:
      EventPublished:
        $ref: '#/components/messages/EventPublished'
    description: 'Published by Catalog, consumed by Inventory'
  seats-held:
    address: 'seats-held'
    messages:
      SeatsHeld:
        $ref: '#/components/messages/SeatsHeld'
    description: 'Published by Inventory, consumed by Checkout'
  payment-initiated:
    address: 'payment-initiated'
    messages:
      PaymentInitiated:
        $ref: '#/components/messages/PaymentInitiated'
    description: 'Published by Checkout, consumed by AntiFraud'
  payment-confirmed:
    address: 'payment-confirmed'
    messages:
      PaymentConfirmed:
        $ref: '#/components/messages/PaymentConfirmed'
    description: 'Published by Checkout, consumed by Inventory, Delivery, Notifications'
  tickets-issued:
    address: 'tickets-issued'
    messages:
      TicketsIssued:
        $ref: '#/components/messages/TicketsIssued'
    description: 'Published by Delivery, consumed by Notifications'
  transfer-initiated:
    address: 'transfer-initiated'
    messages:
      TransferInitiated:
        $ref: '#/components/messages/TransferInitiated'
    description: 'Published by Delivery, consumed by Notifications'
  event-cancelled:
    address: 'event-cancelled'
    messages:
      EventCancelled:
        $ref: '#/components/messages/EventCancelled'
    description: 'Published by Catalog, consumed by Inventory, Checkout, Delivery, Notifications'

components:
  messages:
    EventPublished:
      name: 'EventPublished'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          eventId:
            type: 'string'
            format: 'uuid'
          publishedAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'eventId'
    SeatsHeld:
      name: 'SeatsHeld'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          holdId:
            type: 'string'
            format: 'uuid'
          eventId:
            type: 'string'
            format: 'uuid'
          tierId:
            type: 'string'
            format: 'uuid'
          sectionId:
            type: 'string'
            format: 'uuid'
          quantity:
            type: 'number'
          customerId:
            type: 'string'
            format: 'uuid'
          sessionId:
            type: 'string'
            format: 'uuid'
          expiresAt:
            type: 'string'
            format: 'date-time'
          heldAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'holdId'
          - 'eventId'
          - 'tierId'
          - 'quantity'
          - 'customerId'
          - 'expiresAt'
    PaymentInitiated:
      name: 'PaymentInitiated'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          paymentId:
            type: 'string'
            format: 'uuid'
          cartId:
            type: 'string'
            format: 'uuid'
          customerId:
            type: 'string'
            format: 'uuid'
          paymentMethod:
            $ref: '#/components/schemas/PaymentMethod'
          subtotal:
            type: 'number'
          totalFees:
            type: 'number'
          totalAmount:
            type: 'number'
          initiatedAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'paymentId'
          - 'customerId'
          - 'totalAmount'
    PaymentConfirmed:
      name: 'PaymentConfirmed'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          paymentId:
            type: 'string'
            format: 'uuid'
          paymentConfirmationId:
            type: 'string'
            format: 'uuid'
          orderId:
            type: 'string'
            format: 'uuid'
          customerId:
            type: 'string'
            format: 'uuid'
          eventId:
            type: 'string'
            format: 'uuid'
          holdId:
            type: 'string'
            format: 'uuid'
          gatewayTransactionId:
            type: 'string'
          confirmedAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'holdId'
          - 'paymentConfirmationId'
    TicketsIssued:
      name: 'TicketsIssued'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          orderId:
            type: 'string'
            format: 'uuid'
          customerId:
            type: 'string'
            format: 'uuid'
          eventId:
            type: 'string'
            format: 'uuid'
          holdId:
            type: 'string'
            format: 'uuid'
          tickets:
            type: 'array'
            items:
              $ref: '#/components/schemas/TicketAllocation'
          barcodes:
            type: 'array'
            items:
              $ref: '#/components/schemas/Barcode'
          issuedAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'orderId'
          - 'customerId'
    TransferInitiated:
      name: 'TransferInitiated'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          transferId:
            type: 'string'
            format: 'uuid'
          ticketId:
            type: 'string'
            format: 'uuid'
          fromCustomerId:
            type: 'string'
            format: 'uuid'
          toEmail:
            type: 'string'
          toName:
            type: 'string'
          expiresAt:
            type: 'string'
            format: 'date-time'
          initiatedAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'transferId'
          - 'ticketId'
          - 'toEmail'
          - 'toName'
    EventCancelled:
      name: 'EventCancelled'
      payload:
        type: 'object'
        additionalProperties: false
        properties:
          eventId:
            type: 'string'
            format: 'uuid'
          reason:
            type: 'string'
          cancelledAt:
            type: 'string'
            format: 'date-time'
        required:
          - 'eventId'
          - 'reason'
  schemas:
    Barcode:
      type: 'object'
      additionalProperties: false
      required:
        - 'ticketId'
        - 'barcodeType'
        - 'barcodeValue'
        - 'rotatesAt'
      properties:
        ticketId:
          type: 'string'
          format: 'uuid'
        barcodeType:
          type: 'string'
        barcodeValue:
          type: 'string'
        rotatesAt:
          type: 'string'
          format: 'date-time'
    BillingAddress:
      type: 'object'
      additionalProperties: false
      required:
        - 'street'
        - 'city'
        - 'state'
        - 'postalCode'
        - 'country'
      properties:
        street:
          type: 'string'
        city:
          type: 'string'
        state:
          type: 'string'
        postalCode:
          type: 'string'
        country:
          type: 'string'
    PaymentMethod:
      type: 'object'
      additionalProperties: false
      required:
        - 'methodType'
        - 'lastFourDigits'
        - 'expiryMonth'
        - 'expiryYear'
        - 'billingAddress'
      properties:
        methodType:
          type: 'string'
        lastFourDigits:
          type: 'string'
        expiryMonth:
          type: 'number'
        expiryYear:
          type: 'number'
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
    TicketAllocation:
      type: 'object'
      additionalProperties: false
      required:
        - 'tierId'
        - 'sectionId'
        - 'seatId'
        - 'row'
        - 'seatNumber'
      properties:
        tierId:
          type: 'string'
          format: 'uuid'
        sectionId:
          type: 'string'
          format: 'uuid'
        seatId:
          type: 'string'
          format: 'uuid'
        row:
          type: 'string'
        seatNumber:
          type: 'number'
