name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm turbo generate

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Unit tests with coverage
        run: pnpm turbo test -- --coverage

      - name: Integration tests
        run: pnpm turbo test:integration
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage/

      - name: Snapshot freshness
        run: pnpm turbo test -- --no-update

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  xray-import:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/
        continue-on-error: true

      - name: Authenticate to Xray
        id: xray-auth
        run: |
          TOKEN=$(curl -s -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            | tr -d '"')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Import JUnit XML results
        if: hashFiles('test-results/**/junit.xml') != ''
        run: |
          for f in test-results/**/junit.xml; do
            curl -s -X POST \
              https://xray.cloud.getxray.app/api/v2/import/execution/junit \
              -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
              -H "Content-Type: application/xml" \
              -d @"$f" || true
          done

      - name: Import Cucumber JSON results
        if: hashFiles('test-results/**/cucumber.json') != ''
        run: |
          for f in test-results/**/cucumber.json; do
            curl -s -X POST \
              https://xray.cloud.getxray.app/api/v2/import/execution/cucumber \
              -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
              -H "Content-Type: application/json" \
              -d @"$f" || true
          done
