name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm turbo generate

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Unit tests with coverage
        run: pnpm turbo test -- --coverage --passWithNoTests

      - name: Integration tests
        run: pnpm turbo test:integration -- --passWithNoTests
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage/

      - name: Upload JUnit test results
        uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == 22
        with:
          name: junit-results
          path: packages/*/test-results/junit.xml

      - name: Snapshot freshness
        run: pnpm turbo test -- --no-update --passWithNoTests

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  xray-import:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout (for shared scripts)
        uses: actions/checkout@v4
      - name: Download JUnit test results
        uses: actions/download-artifact@v4
        with:
          name: junit-results
          path: test-results/

      - name: Resolve sprint from feature branch story
        id: sprint
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          STORY_KEY=$(echo "$BRANCH" | sed -n 's/^[a-z]*\/\(MMNT-[0-9]*\).*/\1/p')

          if [ -z "$STORY_KEY" ]; then
            # Only resolve active sprint on main push — skip for non-story PRs (e.g. dependabot)
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
              echo "Main push — resolving active sprint from board."
              SPRINT_ID=$(curl -s --connect-timeout 10 --max-time 15 -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                "https://winnovation.atlassian.net/rest/agile/1.0/board/36/sprint?state=active" \
                | jq -r '.values[0].id // empty')
              if [ -n "$SPRINT_ID" ]; then
                echo "Resolved active sprint ID $SPRINT_ID from board"
              else
                echo "::warning::No active sprint found — sprint scoping skipped."
              fi
              echo "id=$SPRINT_ID" >> $GITHUB_OUTPUT
            else
              echo "::notice::No story key in branch '$BRANCH' — sprint scoping skipped."
              echo "id=" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          SPRINT_ID=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/api/3/issue/$STORY_KEY?fields=customfield_10020" \
            | jq -r '.fields.customfield_10020[0].id // empty')

          if [ -n "$SPRINT_ID" ]; then
            echo "Resolved sprint ID $SPRINT_ID from $STORY_KEY"
          else
            echo "::warning::No sprint found on $STORY_KEY — sprint scoping skipped."
          fi
          echo "id=$SPRINT_ID" >> $GITHUB_OUTPUT
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Authenticate to Xray
        id: xray-auth
        run: |
          TOKEN=$(curl -s -X POST \
            https://xray.cloud.getxray.app/api/v2/authenticate \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            | tr -d '"')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Import JUnit XML results
        id: xray-import
        run: |
          SPRINT_ID="${{ steps.sprint.outputs.id }}"
          SPRINT_FIELD=""
          if [ -n "$SPRINT_ID" ]; then
            SPRINT_FIELD=",\"customfield_10020\":$SPRINT_ID"
          fi

          EXEC_IDS=""
          for f in $(find test-results -name 'junit.xml'); do
            # Skip empty JUnit files (no test cases)
            if ! grep -q '<testcase' "$f" 2>/dev/null; then
              echo "Skipping $f — no test cases."
              continue
            fi
            echo "Importing $f..."
            RESPONSE=$(curl -s --connect-timeout 10 --max-time 60 -X POST \
              "https://xray.cloud.getxray.app/api/v2/import/execution/junit/multipart" \
              -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
              -F "info=@-;type=application/json" <<< "{\"fields\":{\"project\":{\"key\":\"MMNT\"},\"summary\":\"CI Run #${{ github.run_number }} — JUnit\",\"issuetype\":{\"name\":\"Test Execution\"}${SPRINT_FIELD}},\"xpiTestPlanKey\":\"MMNT-585\"}" \
              -F "results=@${f};type=application/xml" || true)
            # Xray multipart response is { id, key, self } at top level
            EXEC_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            EXEC_KEY=$(echo "$RESPONSE" | jq -r '.key // empty')
            if [ -n "$EXEC_ID" ]; then
              EXEC_IDS="$EXEC_IDS $EXEC_ID"
              echo "  Created Test Execution: $EXEC_KEY (id: $EXEC_ID)"
            else
              echo "  Warning: no execution ID in response: $(echo "$RESPONSE" | head -c 200)"
            fi
          done
          echo "ids=$(echo $EXEC_IDS | xargs)" >> $GITHUB_OUTPUT

      - name: Transition Test issues based on execution results
        if: steps.xray-import.outputs.ids != ''
        run: |
          echo "Querying test run results and transitioning Test issues..."

          .github/scripts/jira-search.sh \
            --jql "project=MMNT AND issuetype=Test AND status=Planned ORDER BY key ASC" \
            --fields "key" \
            --output /tmp/planned-tests.json

          PLANNED_KEYS=$(jq -r '.[].key' /tmp/planned-tests.json | sort)

          if [ -z "$PLANNED_KEYS" ]; then
            echo "No Test issues in Planned state — nothing to transition."
            exit 0
          fi

          PLANNED_COUNT=$(echo "$PLANNED_KEYS" | wc -l)
          echo "Found $PLANNED_COUNT Test issues in Planned state."

          TRANSITIONED=0
          for EXEC_ID in ${{ steps.xray-import.outputs.ids }}; do
            echo "Processing execution id $EXEC_ID..."

            # Paginate through all test runs — Xray caps at 100 per query
            ALL_RUNS=""
            PAGE_START=0
            PAGE_SIZE=100

            while true; do
              QUERY="{\"query\":\"{ getTestExecution(issueId: \\\"$EXEC_ID\\\") { testRuns(limit: $PAGE_SIZE, start: $PAGE_START) { total results { status { name } test { jira(fields: [\\\"key\\\"]) } } } } }\"}"

              GQL_RESPONSE=$(curl -s --connect-timeout 10 --max-time 60 -X POST \
                "https://xray.cloud.getxray.app/api/v2/graphql" \
                -H "Authorization: Bearer ${{ steps.xray-auth.outputs.token }}" \
                -H "Content-Type: application/json" \
                -d "$QUERY")

              TOTAL=$(echo "$GQL_RESPONSE" | jq '.data.getTestExecution.testRuns.total // 0')
              PAGE_RUNS=$(echo "$GQL_RESPONSE" | jq -r '.data.getTestExecution.testRuns.results[]? | "\(.test.jira.key) \(.status.name)"')
              PAGE_COUNT=$(echo "$GQL_RESPONSE" | jq '.data.getTestExecution.testRuns.results | length')

              if [ -n "$PAGE_RUNS" ]; then
                ALL_RUNS="${ALL_RUNS}${ALL_RUNS:+$'\n'}${PAGE_RUNS}"
              fi

              PAGE_START=$((PAGE_START + PAGE_SIZE))
              if [ "$PAGE_START" -ge "$TOTAL" ]; then
                break
              fi
            done

            FETCHED=$(echo "$ALL_RUNS" | grep -c . || echo 0)
            echo "  Fetched $FETCHED of $TOTAL test runs."

            RUNS="$ALL_RUNS"

            while IFS=' ' read -r TEST_KEY STATUS; do
              [ -z "$TEST_KEY" ] && continue

              case "$STATUS" in
                PASSED|PASS) TRANSITION_ID="31" ;;
                FAILED|FAIL) TRANSITION_ID="4" ;;
                *) continue ;;
              esac

              # Only transition if this key is in the Planned set
              if echo "$PLANNED_KEYS" | grep -qx "$TEST_KEY"; then
                curl -s --connect-timeout 5 --max-time 10 \
                  -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                  -X POST "https://winnovation.atlassian.net/rest/api/3/issue/$TEST_KEY/transitions" \
                  -H "Content-Type: application/json" \
                  -d "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" > /dev/null 2>&1 && \
                  TRANSITIONED=$((TRANSITIONED + 1)) && \
                  echo "  $TEST_KEY: $STATUS → transition $TRANSITION_ID" || true
              fi
            done <<< "$RUNS"
          done

          echo "Transitioned $TRANSITIONED Test issues."
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Assign sprintless Test issues to active sprint
        if: steps.sprint.outputs.id != ''
        run: |
          SPRINT_ID="${{ steps.sprint.outputs.id }}"
          echo "Assigning sprintless Test/Test Execution issues to sprint $SPRINT_ID..."

          ASSIGNED=0

          .github/scripts/jira-search.sh \
            --jql "project=MMNT AND issuetype in (Test, 'Test Execution') AND sprint is EMPTY ORDER BY key ASC" \
            --fields "key" \
            --output /tmp/sprintless-tests.json

          KEYS=$(jq -r '.[].key' /tmp/sprintless-tests.json)

          for KEY in $KEYS; do
            [ -z "$KEY" ] && continue
            curl -s --connect-timeout 5 --max-time 10 \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -X PUT "https://winnovation.atlassian.net/rest/api/3/issue/$KEY" \
              -H "Content-Type: application/json" \
              -d "{\"fields\":{\"customfield_10020\":$SPRINT_ID}}" > /dev/null 2>&1 && \
              ASSIGNED=$((ASSIGNED + 1)) && \
              echo "  $KEY → sprint $SPRINT_ID" || \
              echo "  Failed to assign $KEY"
          done

          echo "Assigned $ASSIGNED Test issues to sprint $SPRINT_ID."
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  input-gate-verification:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify input gates
        run: |
          BRANCH="${{ github.head_ref }}"
          STORY_KEY=$(echo "$BRANCH" | sed -n 's/^[a-z]*\/\(MMNT-[0-9]*\).*/\1/p')

          if [ -z "$STORY_KEY" ]; then
            echo "::notice::No story key found in branch '$BRANCH' — skipping input gate verification."
            exit 0
          fi

          echo "Checking input gates for $STORY_KEY..."

          RESPONSE=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/api/3/issue/$STORY_KEY?fields=subtasks")

          # Check for Context Review subtask (A)
          GATE_A_STATUS=$(echo "$RESPONSE" | jq -r \
            '.fields.subtasks[] | select(.fields.summary | test("-A — Context Review")) | .fields.status.name')
          # Check for Test Specification subtask (B)
          GATE_B_STATUS=$(echo "$RESPONSE" | jq -r \
            '.fields.subtasks[] | select(.fields.summary | test("-B — Test Specification")) | .fields.status.name')

          FAILED=0

          if [ -z "$GATE_A_STATUS" ]; then
            echo "::error::Input gate failed: No Context Review subtask found for $STORY_KEY."
            FAILED=1
          elif [ "$GATE_A_STATUS" != "Done" ]; then
            echo "::error::Input gate failed: Context Review subtask for $STORY_KEY is '$GATE_A_STATUS', expected 'Done'."
            FAILED=1
          fi

          if [ -z "$GATE_B_STATUS" ]; then
            echo "::error::Input gate failed: No Test Specification subtask found for $STORY_KEY."
            FAILED=1
          elif [ "$GATE_B_STATUS" != "Done" ]; then
            echo "::error::Input gate failed: Test Specification subtask for $STORY_KEY is '$GATE_B_STATUS', expected 'Done'."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::PR cannot merge until all input gates are complete."
            exit 1
          fi

          echo "✅ Input gates verified: Context Review (Done), Test Specification (Done)."
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  test-traceability-verification:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify test traceability
        run: |
          BRANCH="${{ github.head_ref }}"
          STORY_KEY=$(echo "$BRANCH" | sed -n 's/^[a-z]*\/\(MMNT-[0-9]*\).*/\1/p')

          if [ -z "$STORY_KEY" ]; then
            echo "::notice::No story key found in branch '$BRANCH' — skipping traceability verification."
            exit 0
          fi

          echo "Checking test traceability for $STORY_KEY..."

          # Fetch story with subtasks and issue links
          HTTP_CODE=$(curl -s -o /tmp/jira_response.json -w "%{http_code}" -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/api/3/issue/$STORY_KEY?fields=subtasks,issuelinks")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Traceability gate failed: Jira API returned HTTP $HTTP_CODE for $STORY_KEY. Response: $(cat /tmp/jira_response.json | head -c 200)"
            exit 1
          fi

          RESPONSE=$(cat /tmp/jira_response.json)

          # Validate response has expected fields
          if echo "$RESPONSE" | jq -e '.errorMessages' > /dev/null 2>&1; then
            echo "::error::Traceability gate failed: Jira API error for $STORY_KEY: $(echo "$RESPONSE" | jq -r '.errorMessages[]')"
            exit 1
          fi

          # Check for Traceability Verification subtask (D) — expect exactly one match
          GATE_D_COUNT=$(echo "$RESPONSE" | jq '[.fields.subtasks[] | select(.fields.summary | test("-D — Traceability Verification"))] | length')
          GATE_D_STATUS=$(echo "$RESPONSE" | jq -r '[.fields.subtasks[] | select(.fields.summary | test("-D — Traceability Verification"))][0].fields.status.name // empty')

          if [ "$GATE_D_COUNT" -eq 0 ]; then
            echo "::error::Traceability gate failed: No Traceability Verification subtask found for $STORY_KEY."
            exit 1
          elif [ "$GATE_D_COUNT" -gt 1 ]; then
            echo "::error::Traceability gate failed: Multiple Traceability Verification subtasks found for $STORY_KEY ($GATE_D_COUNT matches). Expected exactly one."
            exit 1
          elif [ "$GATE_D_STATUS" != "Done" ]; then
            echo "::error::Traceability gate failed: Traceability Verification subtask for $STORY_KEY is '$GATE_D_STATUS', expected 'Done'."
            exit 1
          fi

          # Check if the B subtask indicates zero behavioral assertions (type-only stories)
          GATE_B_SUMMARY=$(echo "$RESPONSE" | jq -r '[.fields.subtasks[] | select(.fields.summary | test("-B — Test Specification"))][0].fields.summary // empty')
          IS_ZERO_ASSERTION=$(echo "$GATE_B_SUMMARY" | grep -ci "zero" || true)

          # Verify the story has at least one 'Test' issue link (unless zero assertions confirmed)
          TEST_LINK_COUNT=$(echo "$RESPONSE" | jq '[.fields.issuelinks[] | select(.type.name == "Test")] | length')

          if [ "$TEST_LINK_COUNT" -eq 0 ] && [ "$IS_ZERO_ASSERTION" -gt 0 ]; then
            echo "✅ Test traceability verified: Subtask D (Done), zero Test links expected (type-only story with zero behavioral assertions)."
          elif [ "$TEST_LINK_COUNT" -eq 0 ]; then
            echo "::error::Traceability gate failed: $STORY_KEY has zero 'Test' issue links. All Test issues must be linked to the parent story."
            exit 1
          else
            echo "✅ Test traceability verified: Subtask D (Done), $TEST_LINK_COUNT Test issue link(s) found."
          fi
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Complexity check
        run: pnpm turbo lint

      - name: Build CLI bundle
        run: pnpm turbo build --filter=@mmmnt/cli

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(stat -f%z packages/cli/dist/moment.mjs 2>/dev/null || stat -c%s packages/cli/dist/moment.mjs)
          WARN_THRESHOLD=4194304
          FAIL_THRESHOLD=5242880
          echo "CLI bundle size: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -gt "$FAIL_THRESHOLD" ]; then
            echo "::error::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 5MB limit"
            exit 1
          elif [ "$BUNDLE_SIZE" -gt "$WARN_THRESHOLD" ]; then
            echo "::warning::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 4MB warning threshold"
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate || true

  security:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snyk SCA
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

      - name: Snyk SAST
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test

      - name: Snyk License
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --license

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  close-test-issues:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    env:
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Checkout (for shared scripts)
        uses: actions/checkout@v4

      - name: Transition linked Test issues to Done
        run: |
          echo "Scanning for non-Done Test and Test Execution issues with Done parent stories..."

          .github/scripts/jira-search.sh \
            --jql "project=MMNT AND issuetype in (Test, 'Test Execution') AND status != Done ORDER BY key ASC" \
            --fields "key,issuelinks" \
            --output /tmp/non-done-tests.json

          TRANSITIONED=0
          TOTAL=$(jq 'length' /tmp/non-done-tests.json)
          echo "Found $TOTAL non-Done Test issues."

          for KEY in $(jq -r '.[].key' /tmp/non-done-tests.json); do
            PARENT_DONE=$(jq -r --arg key "$KEY" '
              first(
                .[] | select(.key == $key) |
                .fields.issuelinks[]? |
                select(.type.name == "Test" and .outwardIssue != null) |
                select(.outwardIssue.fields.status.name == "Done") |
                .outwardIssue.key
              ) // empty' /tmp/non-done-tests.json)

            if [ -n "$PARENT_DONE" ]; then
              if curl --fail -s --connect-timeout 5 --max-time 10 \
                -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
                -X POST "https://winnovation.atlassian.net/rest/api/3/issue/$KEY/transitions" \
                -H "Content-Type: application/json" \
                -d '{"transition":{"id":"31"}}' > /dev/null 2>&1; then
                TRANSITIONED=$((TRANSITIONED + 1))
                echo "  $KEY → Done (parent: $PARENT_DONE)"
              else
                echo "  Failed to transition $KEY (parent: $PARENT_DONE)" >&2
              fi
            fi
          done

          echo "Transitioned $TRANSITIONED of $TOTAL Test issues to Done."

      - name: Transition Test Execution issues to Done
        run: |
          echo "Transitioning non-Done Test Execution issues to Done after successful CI build..."

          .github/scripts/jira-search.sh \
            --jql "project=MMNT AND issuetype='Test Execution' AND status != Done ORDER BY key ASC" \
            --fields "key" \
            --output /tmp/non-done-executions.json

          TRANSITIONED=0
          TOTAL=$(jq 'length' /tmp/non-done-executions.json)
          echo "Found $TOTAL non-Done Test Execution issues."

          for KEY in $(jq -r '.[].key' /tmp/non-done-executions.json); do
            if curl --fail -s --connect-timeout 5 --max-time 10 \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -X POST "https://winnovation.atlassian.net/rest/api/3/issue/$KEY/transitions" \
              -H "Content-Type: application/json" \
              -d '{"transition":{"id":"31"}}' > /dev/null 2>&1; then
              TRANSITIONED=$((TRANSITIONED + 1))
              echo "  $KEY → Done"
            else
              echo "  Failed to transition $KEY" >&2
            fi
          done

          echo "Transitioned $TRANSITIONED of $TOTAL Test Execution issues to Done."

      - name: Assign sprintless Test issues to active sprint
        run: |
          echo "Assigning sprintless Test/Test Execution issues to active sprint..."

          SPRINT_ID=$(curl -s --connect-timeout 10 --max-time 15 -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/agile/1.0/board/36/sprint?state=active" \
            | jq -r '.values[0].id // empty')

          if [ -z "$SPRINT_ID" ]; then
            echo "No active sprint found — skipping."
            exit 0
          fi

          echo "Active sprint: $SPRINT_ID"

          .github/scripts/jira-search.sh \
            --jql "project=MMNT AND issuetype in (Test, 'Test Execution') AND sprint is EMPTY ORDER BY key ASC" \
            --fields "key" \
            --output /tmp/sprintless.json

          ASSIGNED=0
          for KEY in $(jq -r '.[].key' /tmp/sprintless.json); do
            curl -s --connect-timeout 5 --max-time 10 \
              -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -X PUT "https://winnovation.atlassian.net/rest/api/3/issue/$KEY" \
              -H "Content-Type: application/json" \
              -d "{\"fields\":{\"customfield_10020\":$SPRINT_ID}}" > /dev/null 2>&1 && \
              ASSIGNED=$((ASSIGNED + 1)) && \
              echo "  $KEY → sprint $SPRINT_ID" || \
              echo "  Failed to assign $KEY"
          done

          echo "Assigned $ASSIGNED issues to sprint $SPRINT_ID."
