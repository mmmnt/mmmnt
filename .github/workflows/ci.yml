name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm turbo generate

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

      - name: Unit tests with coverage
        run: pnpm turbo test -- --coverage

      - name: Integration tests
        run: pnpm turbo test:integration
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage/

      - name: Snapshot freshness
        run: pnpm turbo test -- --no-update

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  quality:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Complexity check
        run: pnpm turbo lint

      - name: Build CLI bundle
        run: pnpm turbo build --filter=@mmmnt/cli

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(stat -f%z packages/cli/dist/moment.mjs 2>/dev/null || stat -c%s packages/cli/dist/moment.mjs)
          WARN_THRESHOLD=4194304
          FAIL_THRESHOLD=5242880
          echo "CLI bundle size: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -gt "$FAIL_THRESHOLD" ]; then
            echo "::error::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 5MB limit"
            exit 1
          elif [ "$BUNDLE_SIZE" -gt "$WARN_THRESHOLD" ]; then
            echo "::warning::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 4MB warning threshold"
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate || true
