name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm turbo generate

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      # Fail fast if any library package imports a module that isn't declared
      # in its dependencies/peerDependencies. Catches the class of bug that
      # shipped in @mmmnt/core@0.1.1 — `langium` was only in devDependencies,
      # so consumers running `npm install @mmmnt/core` couldn't resolve it
      # and every command that parsed a .moment file crashed. Workspace tests
      # didn't catch it because pnpm's hoisted workspace resolves devDeps too.
      # Static analysis of package.json ↔ source imports, ~1s to run.
      - name: Runtime dependency audit
        run: pnpm audit:deps

      - name: Build
        run: pnpm turbo build

      - name: Unit tests with coverage
        run: pnpm turbo test -- --coverage --passWithNoTests

      # Pack every @mmmnt/* package, install the tarballs into a throwaway
      # consumer project, and run the full CLI happy path (init → parse →
      # generate → emit-ts → simulate → serve) plus dynamic imports of every
      # library package. Catches packaging-level bugs workspace tests miss:
      # missing dist files, wrong main/exports paths, runtime deps only in
      # devDependencies, broken bin links, or dist output that doesn't
      # resolve from outside the monorepo.
      #
      # Scoped to Node 22 only — the consumer-install path isn't
      # Node-version-sensitive enough to justify running it twice, and the
      # job adds ~40s wall clock.
      - name: Pack-and-install smoke test
        if: matrix.node-version == 22
        run: pnpm smoke:install

      - name: Integration tests
        run: pnpm turbo test:integration -- --passWithNoTests
        continue-on-error: true

      - name: Verify Facet scenarios are up to date
        if: matrix.node-version == 22
        run: |
          MOMENT="node packages/cli/dist/moment.mjs"
          STALE=0
          for dir in examples/*/; do
            SPEC=$(find "$dir/spec" -name "*.moment" -maxdepth 1 2>/dev/null | head -1)
            if [ -n "$SPEC" ] && [ -d "${dir}facet" ]; then
              $MOMENT simulate "$SPEC" --all --out-dir "/tmp/facet-check" 2>/dev/null
              if ! diff -q "/tmp/facet-check/manifest.json" "${dir}facet/manifest.json" > /dev/null 2>&1; then
                echo "::error::Facet scenarios in ${dir}facet/ are stale. Run: moment simulate $SPEC --all --out-dir ${dir}facet"
                STALE=1
              fi
              rm -rf /tmp/facet-check
            fi
          done
          if [ "$STALE" -eq 1 ]; then
            echo "Facet scenario files are out of date. The pre-commit hook should have regenerated them."
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage/

      - name: Snapshot freshness
        run: pnpm turbo test -- --no-update --passWithNoTests

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  input-gate-verification:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify input gates
        run: |
          BRANCH="$HEAD_REF"
          STORY_KEY=$(echo "$BRANCH" | sed -n 's/^[a-z]*\/\(MMNT-[0-9]*\).*/\1/p')

          if [ -z "$STORY_KEY" ]; then
            echo "::notice::No story key found in branch '$BRANCH' — skipping input gate verification."
            exit 0
          fi

          echo "Checking input gates for $STORY_KEY..."

          RESPONSE=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/api/3/issue/$STORY_KEY?fields=subtasks")

          # Check for Context Review subtask (A)
          GATE_A_STATUS=$(echo "$RESPONSE" | jq -r \
            '.fields.subtasks[] | select(.fields.summary | test("-A — Context Review")) | .fields.status.name')
          # Check for Test Specification subtask (B)
          GATE_B_STATUS=$(echo "$RESPONSE" | jq -r \
            '.fields.subtasks[] | select(.fields.summary | test("-B — Test Specification")) | .fields.status.name')

          FAILED=0

          if [ -z "$GATE_A_STATUS" ]; then
            echo "::error::Input gate failed: No Context Review subtask found for $STORY_KEY."
            FAILED=1
          elif [ "$GATE_A_STATUS" != "Done" ]; then
            echo "::error::Input gate failed: Context Review subtask for $STORY_KEY is '$GATE_A_STATUS', expected 'Done'."
            FAILED=1
          fi

          if [ -z "$GATE_B_STATUS" ]; then
            echo "::error::Input gate failed: No Test Specification subtask found for $STORY_KEY."
            FAILED=1
          elif [ "$GATE_B_STATUS" != "Done" ]; then
            echo "::error::Input gate failed: Test Specification subtask for $STORY_KEY is '$GATE_B_STATUS', expected 'Done'."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::PR cannot merge until all input gates are complete."
            exit 1
          fi

          echo "✅ Input gates verified: Context Review (Done), Test Specification (Done)."
        env:
          # Branch names are chosen by whoever opens the PR; reach the script only through env.
          HEAD_REF: ${{ github.head_ref }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  test-traceability-verification:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify test traceability
        run: |
          BRANCH="$HEAD_REF"
          STORY_KEY=$(echo "$BRANCH" | sed -n 's/^[a-z]*\/\(MMNT-[0-9]*\).*/\1/p')

          if [ -z "$STORY_KEY" ]; then
            echo "::notice::No story key found in branch '$BRANCH' — skipping traceability verification."
            exit 0
          fi

          echo "Checking test traceability for $STORY_KEY..."

          # Fetch story with subtasks and issue links
          HTTP_CODE=$(curl -s -o /tmp/jira_response.json -w "%{http_code}" -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "https://winnovation.atlassian.net/rest/api/3/issue/$STORY_KEY?fields=subtasks,issuelinks")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Traceability gate failed: Jira API returned HTTP $HTTP_CODE for $STORY_KEY. Response: $(cat /tmp/jira_response.json | head -c 200)"
            exit 1
          fi

          RESPONSE=$(cat /tmp/jira_response.json)

          # Validate response has expected fields
          if echo "$RESPONSE" | jq -e '.errorMessages' > /dev/null 2>&1; then
            echo "::error::Traceability gate failed: Jira API error for $STORY_KEY: $(echo "$RESPONSE" | jq -r '.errorMessages[]')"
            exit 1
          fi

          # Check for Traceability Verification subtask (D) — expect exactly one match
          GATE_D_COUNT=$(echo "$RESPONSE" | jq '[.fields.subtasks[] | select(.fields.summary | test("-D — Traceability Verification"))] | length')
          GATE_D_STATUS=$(echo "$RESPONSE" | jq -r '[.fields.subtasks[] | select(.fields.summary | test("-D — Traceability Verification"))][0].fields.status.name // empty')

          if [ "$GATE_D_COUNT" -eq 0 ]; then
            echo "::error::Traceability gate failed: No Traceability Verification subtask found for $STORY_KEY."
            exit 1
          elif [ "$GATE_D_COUNT" -gt 1 ]; then
            echo "::error::Traceability gate failed: Multiple Traceability Verification subtasks found for $STORY_KEY ($GATE_D_COUNT matches). Expected exactly one."
            exit 1
          elif [ "$GATE_D_STATUS" != "Done" ]; then
            echo "::error::Traceability gate failed: Traceability Verification subtask for $STORY_KEY is '$GATE_D_STATUS', expected 'Done'."
            exit 1
          fi

          echo "✅ Test traceability verified: Subtask D (Done)."
        env:
          # Branch names are chosen by whoever opens the PR; reach the script only through env.
          HEAD_REF: ${{ github.head_ref }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Complexity check
        run: pnpm turbo lint

      - name: Build CLI bundle
        run: pnpm turbo build --filter=@mmmnt/cli

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(stat -f%z packages/cli/dist/moment.mjs 2>/dev/null || stat -c%s packages/cli/dist/moment.mjs)
          WARN_THRESHOLD=4194304
          FAIL_THRESHOLD=5242880
          echo "CLI bundle size: $BUNDLE_SIZE bytes"
          if [ "$BUNDLE_SIZE" -gt "$FAIL_THRESHOLD" ]; then
            echo "::error::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 5MB limit"
            exit 1
          elif [ "$BUNDLE_SIZE" -gt "$WARN_THRESHOLD" ]; then
            echo "::warning::CLI bundle size ($BUNDLE_SIZE bytes) exceeds 4MB warning threshold"
          fi

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate || true

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm turbo build --filter=@mmmnt/cli
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      - name: Run E2E test harness
        run: node e2e/harness.mjs

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-output
          path: .moment/generated/

      - name: Comment E2E results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = '.moment/generated/summary.md';
            if (!fs.existsSync(summaryPath)) {
              console.log('No E2E summary found — skipping comment');
              return;
            }
            const body = fs.readFileSync(summaryPath, 'utf-8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('## Moment E2E Test Results') &&
              c.user?.login === 'github-actions[bot]'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  security:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snyk SCA
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

      - name: Snyk SAST
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test

      - name: Snyk License
        if: vars.ENABLE_SNYK == 'true' || vars.ENABLE_SNYK == 'TRUE'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --license

      - name: Gitleaks
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  discord-notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [build, quality, e2e, security]
    steps:
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          BUILD: ${{ needs.build.result }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
          # Untrusted text (a PR title can come from a fork) reaches the script only through env.
          COMMIT_TEXT: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$BUILD" = "success" ] && [ "$QUALITY" = "success" ] && [ "$E2E" = "success" ] && [ "$SECURITY" = "success" ]; then
            COLOR=4318933  # green (#42E695)
            STATUS="Passed"
            EMOJI="✅"
          else
            COLOR=15548997  # red (#ED4245)
            STATUS="Failed"
            EMOJI="❌"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(printf '%s' "$COMMIT_TEXT" | head -n 1 | head -c 80)

          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::Discord webhook URL not available — skipping notification."
            exit 0
          fi

          # jq builds the JSON, so quotes or newlines in the commit text cannot break it.
          PAYLOAD=$(jq -n --arg title "$EMOJI CI $STATUS — #${{ github.run_number }}" \
            --arg description "$(printf '**Branch:** `%s`\n**Commit:** %s\n\n| Job | Status |\n|-----|--------|\n| Build | %s |\n| Quality | %s |\n| E2E | %s |\n| Security | %s |' "$BRANCH" "$COMMIT_MSG" "$BUILD" "$QUALITY" "$E2E" "$SECURITY")" \
            --arg url "$RUN_URL" --argjson color "$COLOR" --arg footer "${{ github.repository }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{title: $title, description: $description, url: $url, color: $color, footer: {text: $footer}, timestamp: $timestamp}]}')
          HTTP=$(curl -sS -o /tmp/discord-response.txt -w '%{http_code}' --connect-timeout 5 --max-time 15 \
            -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL") || HTTP=000
          # A failed notification must not fail the run, but it must be visible (it was silent).
          if [ "${HTTP:0:1}" != "2" ]; then
            echo "::warning title=Discord notification failed::HTTP $HTTP: $(head -c 300 /tmp/discord-response.txt 2>/dev/null)"
          fi
