name: E2E

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('number', prs[0].number);
            core.setOutput('head_ref', run.head_branch);
            core.setOutput('head_sha', run.head_sha);

      - name: Checkout
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.pr.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        if: steps.pr.outputs.skip != 'true'
        run: pnpm turbo build --filter=@mmmnt/cli
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      - name: Run E2E test harness
        if: steps.pr.outputs.skip != 'true'
        run: node e2e/harness.mjs

      - name: Upload E2E artifacts
        if: steps.pr.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .moment/generated/

      - name: Commit generated artifacts
        if: steps.pr.outputs.skip != 'true' && success() && github.event.workflow_run.head_repository.fork == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .moment/generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit --no-verify -m "chore: update .moment/generated from E2E harness [skip ci]"
            git push origin HEAD:${{ steps.pr.outputs.head_ref }}
          fi

      - name: Comment E2E results on PR
        if: steps.pr.outputs.skip != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = '.moment/generated/summary.md';
            if (!fs.existsSync(summaryPath)) {
              console.log('No E2E summary found — skipping comment');
              return;
            }
            const body = fs.readFileSync(summaryPath, 'utf-8');
            const prNumber = ${{ steps.pr.outputs.number }};
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.body?.includes('## Moment E2E Test Results') &&
              c.user?.login === 'github-actions[bot]'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
