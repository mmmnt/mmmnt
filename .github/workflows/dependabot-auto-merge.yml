name: Dependabot Auto-Merge

# Queues minor and patch Dependabot updates to squash-merge once the
# required checks pass. Major updates stay manual.
#
# The built-in GITHUB_TOKEN cannot merge into main, so the step uses the
# mmmnt GitHub App, which is on main's review-bypass list. Required status
# checks still apply. Dependabot-triggered runs only receive Dependabot
# secrets, so APP_ID and APP_PRIVATE_KEY must exist there as well as in
# the Actions secrets the release workflow uses.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Generate GitHub App token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
