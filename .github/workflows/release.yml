name: Release

# Triggered automatically when CI completes on main. The release job only
# runs when CI succeeded, so a broken merge cannot ship.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Generate a short-lived installation token for the mmmnt-release
      # GitHub App. We use this (instead of the default GITHUB_TOKEN) as the
      # auth identity for `changesets/action`'s branch push and PR open, so
      # the resulting version-packages PR gets CI runs. Bot-authored pushes
      # via GITHUB_TOKEN don't trigger other workflows (GitHub anti-loop
      # protection), which is what previously blocked the version PR on
      # required status checks. See mmmnt/mmmnt#140.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (head SHA from triggering CI run)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Using the app token here means subsequent `git push` operations
          # (e.g. the auto-changeset step pushing back to main) authenticate
          # as the app, matching the changesets/action step below.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 24 (ships npm 11+ for OIDC trusted publishing)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      # Auto-generate a changeset from the merge commit's conventional title
      # so devs do not have to remember `pnpm changeset` per PR. The file is
      # written into the working tree (and best-effort committed back to main
      # so subsequent runs can see it). The next step consumes it.
      - name: Auto-generate changeset from merge commit
        id: auto_changeset
        run: |
          set -euo pipefail

          HEAD_SHA=$(git rev-parse --short HEAD)
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          HEAD_BODY=$(git log -1 --pretty=%b)

          echo "Head SHA:     $HEAD_SHA"
          echo "Head subject: $HEAD_SUBJECT"

          # Skip the version-packages release commit itself.
          if [[ "$HEAD_SUBJECT" == "chore: version packages"* ]]; then
            echo "Version-packages commit; nothing to changeset."
            exit 0
          fi

          # Skip auto-changeset commits to avoid runaway loops.
          if [[ "$HEAD_SUBJECT" == "chore: auto-changeset"* ]]; then
            echo "Auto-changeset commit; skipping."
            exit 0
          fi

          # Conventional commit → bump level mapping.
          # The `!` marker on the subject OR a `BREAKING CHANGE` footer in the
          # body produces a major bump. Subject is matched for the type/scope;
          # body is searched for the breaking-change footer per the spec
          # (https://www.conventionalcommits.org/#specification).
          #
          # `feat!:`, `fix!:`, etc. on subject  → major
          # `BREAKING CHANGE:` in body          → major
          # `feat:`                             → minor
          # `fix:`, `perf:`, `refactor:`        → patch
          # everything else                    → no changeset
          if echo "$HEAD_SUBJECT" | grep -qE '^(feat|fix|perf|refactor)(\([^)]+\))?!:'; then
            BUMP=major
          elif echo "$HEAD_BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP=major
          elif echo "$HEAD_SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP=minor
          elif echo "$HEAD_SUBJECT" | grep -qE '^(fix|perf|refactor)(\([^)]+\))?:'; then
            BUMP=patch
          else
            echo "Not a releasable conventional-commit type; no changeset generated."
            exit 0
          fi

          echo "Bump level: $BUMP"

          mkdir -p .changeset
          CHANGESET_FILE=".changeset/auto-${HEAD_SHA}.md"

          # `fixed` group in .changeset/config.json bumps every package together,
          # so naming a single package is enough.
          {
            echo '---'
            echo "'@mmmnt/cli': $BUMP"
            echo '---'
            echo
            echo "${HEAD_SUBJECT}"
          } > "$CHANGESET_FILE"

          echo "Wrote ${CHANGESET_FILE}:"
          cat "$CHANGESET_FILE"

          # Best-effort: commit the changeset back to main so the next release
          # run sees it even if the changesets action's version PR is delayed.
          # `[skip ci]` prevents CI from re-running, which also means
          # `workflow_run` will not retrigger this workflow.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CHANGESET_FILE"

          # Guard against re-runs on the same SHA (or identical staged content):
          # `git commit` exits non-zero on "nothing to commit", which would fail
          # the whole job under `set -e`.
          if git diff --cached --quiet; then
            echo "No staged changes for ${CHANGESET_FILE}; skipping commit and push."
          else
            git commit -m "chore: auto-changeset for ${HEAD_SHA} [skip ci]"

            if git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"; then
              echo "Pushed auto-changeset back to ${{ github.event.workflow_run.head_branch }}."
            else
              echo "::warning::Could not push auto-changeset back to main (branch protection?). The changeset still exists in the working tree and will be consumed by changesets/action in this run."
            fi
          fi

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm -r publish --access public --no-git-checks
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          # App token (not secrets.GITHUB_TOKEN) so the version-packages PR
          # is authored by the mmmnt-release app. GitHub cascades workflow
          # runs for app-authored pushes; it suppresses cascades for pushes
          # authored via the default GITHUB_TOKEN. This is why the previous
          # version PR (mmmnt/mmmnt#140) got stuck with no CI runs.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

  discord-notify:
    runs-on: ubuntu-latest
    # Don't notify if release was skipped because CI failed — the CI workflow
    # already announces its own failure on main.
    if: always() && needs.release.result != 'skipped'
    needs: [release]
    steps:
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          RELEASE: ${{ needs.release.result }}
        run: |
          if [ "$RELEASE" = "success" ]; then
            COLOR=4318933
            EMOJI="🚀"
            STATUS="Published"
          else
            COLOR=15548997
            EMOJI="❌"
            STATUS="Failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$EMOJI Release $STATUS\",
              \"description\": \"Release workflow completed with status: **$RELEASE**\",
              \"url\": \"$RUN_URL\",
              \"color\": $COLOR,
              \"footer\": {\"text\": \"${{ github.repository }}\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$WEBHOOK_URL"
