name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 24 (ships npm 11+ for OIDC trusted publishing)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm -r publish --access public --no-git-checks
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  discord-notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [release]
    steps:
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          RELEASE: ${{ needs.release.result }}
        run: |
          if [ "$RELEASE" = "success" ]; then
            COLOR=4318933
            EMOJI="🚀"
            STATUS="Published"
          else
            COLOR=15548997
            EMOJI="❌"
            STATUS="Failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$EMOJI Release $STATUS\",
              \"description\": \"Release workflow completed with status: **$RELEASE**\",
              \"url\": \"$RUN_URL\",
              \"color\": $COLOR,
              \"footer\": {\"text\": \"${{ github.repository }}\"},
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$WEBHOOK_URL"
