name: Release

# Triggered automatically when CI completes on main. The release job only
# runs when CI succeeded, so a broken merge cannot ship.
# Also supports manual triggering via the Actions UI as a safety valve
# when workflow_run doesn't fire (e.g. the chicken-and-egg gotcha after
# a workflow file change, or to re-run a failed publish).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      # true only when this run published packages; otherwise it opened or updated the version PR.
      published: ${{ steps.changesets.outputs.published }}
      # The toolchain version this run published (@mmmnt/cli's), for the extension job.
      version: ${{ steps.released.outputs.version }}
    steps:
      # Generate a short-lived installation token for the mmmnt-release
      # GitHub App. We use this (instead of the default GITHUB_TOKEN) as the
      # auth identity for `changesets/action`'s branch push and PR open, so
      # the resulting version-packages PR gets CI runs. Bot-authored pushes
      # via GITHUB_TOKEN don't trigger other workflows (GitHub anti-loop
      # protection), which is what previously blocked the version PR on
      # required status checks. See mmmnt/mmmnt#140.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_run provides head_sha; workflow_dispatch uses the
          # default branch HEAD (github.sha). The || fallback keeps
          # both triggers working without a separate checkout step.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # Using the app token here means subsequent `git push` operations
          # (e.g. the auto-changeset step pushing back to main) authenticate
          # as the app, matching the changesets/action step below.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24 (ships npm 11+ for OIDC trusted publishing)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      # Auto-generate a changeset from the merge commit's conventional title
      # so devs do not have to remember `pnpm changeset` per PR. The file is
      # written into the working tree (and best-effort committed back to main
      # so subsequent runs can see it). The next step consumes it.
      - name: Auto-generate changesets from the merge commits since the last release
        id: auto_changeset
        run: |
          set -euo pipefail
          # Every releasable commit since the last version-packages commit, not only the head: a
          # merge-queue batch lands several squash commits in one push, and only the head's title
          # used to become a changeset. The files are written into the working tree, never committed
          # (changesets/action hard-resets the version branch to this commit; untracked files survive
          # the reset, so `changeset version` consumes them), so each run regenerates the same set
          # and the version PR matches exactly what merged since the last release.
          # (git log --grep, not git log | awk ... exit: under pipefail the early exit fails the pipe.)
          BASE=$(git log -1 --format=%H --grep='^chore: version packages')
          if [ -n "$BASE" ]; then RANGE="$BASE..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          echo "Commits in $RANGE:"
          mkdir -p .changeset
          for SHA in $(git rev-list --reverse --no-merges "$RANGE"); do
            SHORT=$(git rev-parse --short "$SHA")
            SUBJECT=$(git log -1 --pretty=%s "$SHA")
            BODY=$(git log -1 --pretty=%b "$SHA")
            # Skip the version-packages commit itself and auto-changeset commits.
            if [[ "$SUBJECT" == "chore: version packages"* || "$SUBJECT" == "chore: auto-changeset"* ]]; then continue; fi
            # A commit that adds its own changeset needs no generated one (it would duplicate the entry).
            if git diff-tree --no-commit-id --name-only --diff-filter=A -r "$SHA" -- '.changeset/*.md' | grep -q .; then
              echo "  $SHORT adds a changeset"; continue
            fi
            # Conventional commit → bump: `!` on a releasable type or a BREAKING CHANGE footer → major,
            # feat → minor, fix / perf / refactor → patch, anything else → no changeset.
            if echo "$SUBJECT" | grep -qE '^(feat|fix|perf|refactor)(\([^)]+\))?!:'; then BUMP="major"
            elif echo "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor)(\([^)]+\))?:'; then BUMP="patch"
            else echo "  $SHORT not releasable: $SUBJECT"; continue
            fi
            # The fixed group in .changeset/config.json bumps every package together, so naming one
            # is enough.
            printf -- "---\n'@mmmnt/cli': %s\n---\n\n%s\n" "$BUMP" "$SUBJECT" > ".changeset/auto-$SHORT.md"
            echo "  $SHORT $BUMP: $SUBJECT"
          done

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # App token (not the default GITHUB_TOKEN) so the version-packages PR
          # is authored by the mmmnt-release app. GitHub cascades workflow
          # runs for app-authored pushes; it suppresses cascades for pushes
          # authored via the default GITHUB_TOKEN. This is why the previous
          # version PR (mmmnt/mmmnt#140) got stuck with no CI runs. Action v2
          # reads the token only from this input and pushes through the GitHub
          # API, so the version commit is signed and attributed to the app.
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm changeset:version
          # `changeset publish` (not `pnpm -r publish`) so the action can
          # detect published packages and create git tags + GitHub releases.
          # v0.4.0 shipped untagged because raw pnpm publish output was not
          # read by changesets/action. The action passes CHANGESETS_OUTPUT to
          # this script; `changeset publish` writes the published list there.
          publish-script: pnpm changeset publish
          create-github-releases: true
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # npm authenticates through OIDC trusted publishing (id-token: write).
          NPM_CONFIG_PROVENANCE: true

      - name: Read the released version
        id: released
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

  # The VS Code extension is released with the toolchain, at its version, from the released commit.
  extension:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/extension.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  discord-notify:
    runs-on: ubuntu-latest
    # Don't notify if release was skipped because CI failed — the CI workflow
    # already announces its own failure on main.
    if: always() && needs.release.result != 'skipped'
    needs: [release]
    steps:
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          RELEASE: ${{ needs.release.result }}
          PUBLISHED: ${{ needs.release.outputs.published }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::Discord webhook URL not available — skipping notification."
            exit 0
          fi
          if [ "$RELEASE" = "success" ] && [ "$PUBLISHED" = "true" ]; then
            COLOR=4318933
            EMOJI="🚀"
            STATUS="Published"
          elif [ "$RELEASE" = "success" ]; then
            # The run only opened or updated the version PR; nothing reached npm.
            COLOR=5793266
            EMOJI="📦"
            STATUS="Version PR Updated"
          else
            COLOR=15548997
            EMOJI="❌"
            STATUS="Failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n --arg title "$EMOJI Release $STATUS" \
            --arg description "Release workflow completed with status: **$RELEASE**" \
            --arg url "$RUN_URL" --argjson color "$COLOR" --arg footer "${{ github.repository }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{title: $title, description: $description, url: $url, color: $color, footer: {text: $footer}, timestamp: $timestamp}]}')
          HTTP=$(curl -sS -o /tmp/discord-response.txt -w '%{http_code}' --connect-timeout 5 --max-time 15 \
            -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL") || HTTP=000
          # A failed notification must not fail the run, but it must be visible (it was silent).
          if [ "${HTTP:0:1}" != "2" ]; then
            echo "::warning title=Discord notification failed::HTTP $HTTP: $(head -c 300 /tmp/discord-response.txt 2>/dev/null)"
          fi
