name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 (ships npm 11+ for OIDC trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}

      - name: Publish all packages with OIDC provenance
        run: |
          for pkg in core derive emit-ts generate harness schema sync viz cli mcp; do
            echo "Publishing @mmmnt/$pkg..."
            cd packages/$pkg
            npm publish --provenance --access public 2>&1 || echo "Skipped @mmmnt/$pkg (already published or error)"
            cd ../..
          done

      - name: Create Release PR (for future changesets)
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: echo "publish handled above"
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
